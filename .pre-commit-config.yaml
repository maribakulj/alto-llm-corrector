# Pre-commit hooks for alto-llm-corrector.
# Install with: pre-commit install
#
# All hooks run on changed files only — fast enough to run on every commit.
# CI re-runs the full suite on every push.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Non-regression corpora are deliberately large (word-level
        # polygons on full newspaper pages): examples/page/newseye-fr/*.xml
        # is ~2.4 MB per page. Everything else keeps the 1 MB guard.
        exclude: ^examples/page/newseye-fr/.*\.xml$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      # The tree is flat since 2026-08-16: the library IS the repository.
      # surface saknussemm lint issues before CI does.
      - id: ruff-check
        args: [--fix]
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/

  # mypy and prettier both lived here and both had to go. The mypy block
  # had lost its `hooks:` entries, and pre-commit validates the WHOLE file
  # before running anything — so a `hooks: None` meant not one hook ran,
  # ruff and the >1MB file guard included. The prettier block targeted
  # `frontend/src/`, which left with the demo on 2026-08-16.
  # `mypy --strict` runs in CI, where it is not optional.
