# Pre-commit hooks for alto-llm-corrector.
# Install with: pre-commit install
#
# All hooks run on changed files only — fast enough to run on every commit.
# CI re-runs the full suite on every push.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Non-regression corpora are deliberately large (word-level
        # polygons on full newspaper pages): examples/page/newseye-fr/*.xml
        # is ~2.4 MB per page. Everything else keeps the 1 MB guard.
        exclude: ^examples/page/newseye-fr/.*\.xml$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      # One package left since the demo moved out; the pattern stays
      # anchored rather than bare so a future sibling is a decision.
      # surface lidenbrock lint issues before CI does.
      - id: ruff-check
        args: [--fix]
        files: ^packages/lidenbrock/
      - id: ruff-format
        files: ^packages/lidenbrock/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/src/.*\.(ts|tsx|json|css|md)$
        additional_dependencies:
          - prettier@3.8.3
