name: Publish saknussemm

# Manual-only: a release is a deliberate act, not a side-effect of a
# merge. The repo maintainer triggers this from the GitHub UI
# (Actions → Publish saknussemm → Run workflow) after bumping the
# version in src/saknussemm/__init__.py and updating CHANGELOG.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

# Trusted Publishing (PEP 740 / OIDC) needs `id-token: write`. No
# long-lived PyPI token is stored as a GitHub secret — the workflow
# exchanges its OIDC token for a short-lived PyPI credential at
# upload time.
#
# `id-token: write` is NOT granted here. It used to be, at workflow level,
# which put ACTIONS_ID_TOKEN_REQUEST_URL and its token in the environment of
# every step of the single job — including three that execute code resolved
# from PyPI at publish time: `pip install cyclonedx-bom`, and the wheel
# smoke-install which resolves and then IMPORTS pydantic and lxml. Any of
# them could mint an OIDC token of audience `pypi` and exfiltrate it; the
# resulting upload would carry a valid PEP 740 attestation, because the
# attestation says "this workflow signed it" and that would be true.
#
# The two jobs below split that: `prepare-release` may run whatever it needs
# and can mint nothing, `publish` can mint and runs nothing but pinned
# actions and `gh`. Trusted Publishing keys on the workflow FILENAME, not on
# a job name, so the pending-publisher configuration is unaffected.
permissions:
  contents: read
  # Plan V4.3 — the publish gate queries the Actions API to verify the
  # tagged commit has a fully green CI run before anything is built.
  actions: read

# Serialise publish runs. Two operators dispatching the workflow at
# the same time would both build, both attempt OIDC exchange, and
# either (a) collide on the version (PyPI rejects a duplicate upload)
# or (b) waste an OIDC slot. `cancel-in-progress: false` because a
# publish must NOT be cancelled mid-flight — once the wheel is built
# and partially uploaded, we want the run to finish or fail cleanly.
concurrency:
  group: publish-saknussemm-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  # Everything that decides WHETHER to publish, and nothing that can
  # publish. No `id-token`, so no step here can mint a PyPI credential —
  # which is what lets this job install and run tooling freely.
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      # The verified CI run. `publish` re-downloads from it directly rather
      # than receiving bytes from this job: nothing that happens here after
      # the gate can influence what reaches the index.
      ci_run_id: ${{ steps.ci_gate.outputs.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Roadmap L7 / P6 — we verify HEAD is on a release tag below,
          # which needs the tag refs in the local clone. Default depth=1
          # would strip them and the check would always pass vacuously.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify HEAD is on an saknussemm release tag
        # Roadmap L7 / P6 — a release is a deliberate act anchored on a
        # git tag. The workflow_dispatch trigger lets anyone with write
        # access pick any branch SHA; without this guard, a maintainer
        # could accidentally publish whatever the default branch points
        # at. We require an `saknussemm-vX.Y.Z` tag pointing at HEAD,
        # where X.Y.Z matches `saknussemm.__version__` exactly.
        run: |
          VERSION=$(python -c "
          import re, pathlib
          init = pathlib.Path('src/saknussemm/__init__.py').read_text()
          # Optional `(?::\s*[^=]+)?` clause matches both
          #   __version__ = \"X.Y.Z\"
          # and a future type-annotated form
          #   __version__: Final[str] = \"X.Y.Z\"
          # which would otherwise return None and abort the publish.
          m = re.search(r\"__version__\\s*(?::\\s*[^=]+)?=\\s*['\\\"]([^'\\\"]+)['\\\"]\", init)
          if not m:
              raise SystemExit('__version__ not found in src/saknussemm/__init__.py')
          print(m.group(1))
          ")
          EXPECTED_TAG="saknussemm-v${VERSION}"
          if ! git rev-parse --verify "refs/tags/${EXPECTED_TAG}" >/dev/null 2>&1; then
            echo "::error::Tag '${EXPECTED_TAG}' does not exist in this clone. Create and push it with: git tag ${EXPECTED_TAG} && git push origin ${EXPECTED_TAG}"
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse "${EXPECTED_TAG}^{commit}")
          if [[ "${HEAD_SHA}" != "${TAG_SHA}" ]]; then
            echo "::error::HEAD (${HEAD_SHA}) is not at tag '${EXPECTED_TAG}' (${TAG_SHA}). Move the tag to the commit being published, or re-run the workflow on the tagged commit."
            exit 1
          fi
          echo "Release tag ${EXPECTED_TAG} confirmed at HEAD."

      - name: Verify the tagged commit has a fully green CI run
        # Plan V4.3 — a matching tag proves INTENT, not QUALITY: nothing
        # so far proves the tagged commit ever passed CI. Require a
        # completed, successful run of the CI workflow for this exact
        # SHA — and remember WHICH run, because its build artifact is
        # what gets published below.
        id: ci_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          RUN=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=completed&per_page=1" \
            --jq '{conclusion: (.workflow_runs[0].conclusion // "none"), id: (.workflow_runs[0].id // 0)}')
          CONCLUSION=$(echo "${RUN}" | python3 -c "import json,sys; print(json.load(sys.stdin)['conclusion'])")
          RUN_ID=$(echo "${RUN}" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          if [[ "${CONCLUSION}" != "success" ]]; then
            echo "::error::No successful CI run found for ${SHA} (latest completed: ${CONCLUSION}). Only commits with green CI may be published."
            exit 1
          fi
          echo "CI is green for ${SHA} (run ${RUN_ID})."
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download the exact distributions that CI tested
        # No rebuild: the bytes CI built, smoke-installed and went green
        # on are the bytes that get attested and published. The artifact
        # comes from the verified run above; its SHA256SUMS (written by
        # the CI build job) proves the download is intact. Note: GitHub
        # artifact retention applies — publishing an old tag may require
        # re-running CI on that SHA first, which re-arms the same gate.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.ci_gate.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name saknussemm-dist \
            --dir dist
          cd dist
          sha256sum -c SHA256SUMS
          # twine (inside the publish action) uploads every file in
          # packages-dir and rejects non-distribution formats.
          rm SHA256SUMS
          ls -l

      - name: Smoke-install the wheel
        # Catch packaging regressions before they reach the index.
        # _smoke_imports.py is shared with the CI build job and
        # scripts/release-saknussemm.sh — see roadmap L5 / B6.
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install dist/*.whl
          /tmp/wheel-smoke/bin/python _smoke_imports.py

      - name: Generate SBOM (CycloneDX) for the released artefact
        # Plan V4.3 — a release ships with its bill of materials. The
        # SBOM describes the smoke-install venv (exactly the wheel and
        # its resolved dependencies) but the GENERATOR runs from its own
        # venv, inspecting that environment from outside: installing the
        # tool into the audited venv put pip-audit and its whole
        # dependency tree INTO the shipped SBOM. cyclonedx-py is the
        # reference CycloneDX generator and supports pointing at another
        # environment; pip-audit (the repo's SCA tool) has no such mode.
        # The SBOM lives OUTSIDE dist/: twine (inside the publish action)
        # uploads every file in packages-dir and rejects non-distribution
        # formats, so a .json in dist/ would break the upload.
        run: |
          mkdir -p sbom
          python -m venv /tmp/sbom-tool
          /tmp/sbom-tool/bin/pip install cyclonedx-bom
          /tmp/sbom-tool/bin/cyclonedx-py environment /tmp/wheel-smoke/bin/python \
            > sbom/saknussemm-sbom.cyclonedx.json
          test -s sbom/saknussemm-sbom.cyclonedx.json

      - name: Verify the SBOM describes the wheel, not the tooling
        run: |
          python3 - << 'EOF'
          import json

          with open("sbom/saknussemm-sbom.cyclonedx.json") as fh:
              sbom = json.load(fh)
          components = {c["name"].lower() for c in sbom.get("components", [])}
          assert "saknussemm" in components, f"saknussemm missing: {sorted(components)}"
          for tool in ("pip-audit", "cyclonedx-bom", "cyclonedx-python-lib"):
              assert tool not in components, (
                  f"{tool} polluted the SBOM: {sorted(components)}"
              )
          print(f"SBOM components: {sorted(components)}")
          EOF

      - name: Upload the SBOM and the gate's evidence
        # The operator-facing record of what was checked. Deliberately NOT
        # the channel by which the distributions reach `publish`: that job
        # fetches them from the CI run itself.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: saknussemm-release-evidence
          path: sbom/
          if-no-files-found: error

  # Everything that CAN publish, and nothing else. Two pinned actions and
  # `gh`, which is preinstalled on the runner — no `pip install`, and no
  # checkout, so the job never has a git credential on disk either.
  publish:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      # The only job in this workflow that may mint an OIDC token.
      id-token: write
      # To re-download the distributions from the verified CI run.
      actions: read
    # Map the dispatch input to an Environment so PyPI/TestPyPI rules
    # (required reviewers, branch protection) can be configured per
    # target without touching this file. It belongs to THIS job: the
    # deployment happens here.
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/project/saknussemm/' || 'https://test.pypi.org/project/saknussemm/' }}
    steps:
      - name: Fetch the distributions from the CI run the gate verified
        # From the run itself, not from `prepare-release`. If the tooling
        # that job installs were compromised, it could have rewritten the
        # wheel before handing it over — and its checksums with it, being
        # the same job. Fetching here removes that path entirely: the only
        # thing `prepare-release` gives this job is a run id, and the
        # checksums CI wrote are verified against the bytes CI built.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ needs.prepare-release.outputs.ci_run_id }}" \
            --repo "${{ github.repository }}" \
            --name saknussemm-dist \
            --dir dist
          cd dist
          sha256sum -c SHA256SUMS
          # twine (inside the publish action) uploads every file in
          # packages-dir and rejects non-distribution formats.
          rm SHA256SUMS
          ls -l

      - name: Publish to TestPyPI (Trusted Publishing OIDC + PEP 740)
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          # Plan V4.3 — PEP 740 digital attestations: the publish action
          # signs the distributions with the workflow's OIDC identity and
          # uploads the provenance alongside; PyPI displays and serves it.
          # Pinned explicitly (not left to the action's default) so a
          # future default-flip cannot silently drop provenance.
          attestations: true
          verbose: true

      - name: Publish to PyPI (Trusted Publishing OIDC + PEP 740)
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          packages-dir: dist/
          attestations: true
          verbose: true

      - name: Upload the distributions exactly as published
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: saknussemm-dist-${{ inputs.target }}
          path: dist/
          if-no-files-found: error
