name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal default permissions for every job. Override per-job only if a
# step needs to write (none today).
permissions:
  contents: read

# Cancel in-flight CI when a newer commit is pushed to the same ref.
# Saves CI minutes; the only thing that matters is the latest state.
# Per-ref grouping keeps PRs and pushes to other branches independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lidenbrock-lint:
    runs-on: ubuntu-latest
    # Wave-5 review — no job may idle toward the 6 h default.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/lidenbrock
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.15.14
      - name: ruff check
        # Wave-5 review — tests/ was only covered by pre-commit; a
        # contributor without it could merge unlinted test code.
        run: ruff check src/ tests/
      - name: ruff format --check
        run: ruff format --check src/ tests/
      - name: Version coherence (__init__.py ↔ CHANGELOG.md)
        # Roadmap L7 / P5 — bumping `__version__` without a matching
        # CHANGELOG entry was caught only at release-script time
        # (scripts/release-lidenbrock.sh:55-59); now CI blocks the
        # commit. The check accepts both `## [X.Y.Z]` and
        # `## [X.Y.Z] — date` heading shapes already used in the file.
        # The regex's optional `(?::\s*[^=]+)?` clause tolerates a future
        # type annotation (e.g. `__version__: Final[str] = "..."`); without
        # it, adding a type hint would silently strand CI on the prior
        # branch where it could not find a match.
        run: |
          VERSION=$(python -c "
          import re, pathlib
          init = pathlib.Path('src/lidenbrock/__init__.py').read_text()
          m = re.search(r\"__version__\\s*(?::\\s*[^=]+)?=\\s*['\\\"]([^'\\\"]+)['\\\"]\", init)
          if not m:
              raise SystemExit('__version__ not found in src/lidenbrock/__init__.py')
          print(m.group(1))
          ")
          echo "Detected __version__: ${VERSION}"
          if ! grep -E "^## \\[${VERSION}\\]" CHANGELOG.md > /dev/null; then
            echo "::error file=CHANGELOG.md::__version__ is '${VERSION}' but CHANGELOG.md has no '## [${VERSION}]' heading. Bump the changelog before merging."
            exit 1
          fi
          echo "Version coherence OK: __init__.py == CHANGELOG.md == ${VERSION}"

  lidenbrock-types:
    # F12 / §8.3 — the package ships py.typed and must pass mypy --strict.
    runs-on: ubuntu-latest
    # Wave-5 review — no job may idle toward the 6 h default.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/lidenbrock
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lidenbrock (editable) + mypy + stubs
        # The toolchain is declared in pyproject.toml's `typecheck` extra —
        # keep it there, not pinned a second time here, so a local
        # `pip install -e '.[typecheck]'` checks exactly what this job does.
        run: pip install -e '.[typecheck]'
      - name: mypy --strict
        run: mypy --strict src/lidenbrock

  lidenbrock-tests:
    # Matrix the test suite across every Python version lidenbrock's
    # `requires-python` and Trove classifiers claim to support. Without
    # this, the 3.12/3.13 classifiers in pyproject.toml were unverified
    # promises and a 3.12-only regression would only surface to PyPI
    # consumers. `fail-fast: false` so a single broken version doesn't
    # mask the others' status.
    runs-on: ubuntu-latest
    # Wave-5 review — no job may idle toward the 6 h default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/lidenbrock
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lidenbrock (editable) + the test extra
        # The test toolchain is declared ONCE, in pyproject's `[test]` extra,
        # so `pip install -e '.[test]'` means the same thing here and on a
        # developer's machine. It used to be this hand-written list, which is
        # how a test that needs PyYAML went green locally and red on all three
        # Python versions: the workflow file was the real dependency list, and
        # nothing kept it in step with anyone's venv.
        run: pip install -e '.[test]'
      - name: pytest + coverage gate (85%)
        run: pytest tests/ --cov=lidenbrock --cov-report=term --cov-report=xml

  lidenbrock-external-corpus:
    # Plan V4.2 phase 3 — invariants over REAL Gallica ALTO never seen
    # during development (tests/external_corpus/manifest.json). NON-
    # BLOCKING by design while it builds a track record: the fetch
    # depends on gallica.bnf.fr availability and the corpus content can
    # legitimately change under us (BnF re-OCR). Promote to blocking
    # once it has run green for a while — that promotion is a deliberate
    # one-line change (drop continue-on-error), not a default.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/lidenbrock
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Fetch external corpus from Gallica
        run: python tests/external_corpus/fetch.py
      - name: Install lidenbrock (editable) + the test extra
        run: pip install -e '.[test]'
      - name: pytest (external corpus invariants)
        run: pytest -m external_corpus tests/test_external_corpus.py -v

  lidenbrock-build:
    # Catch packaging regressions (broken classifiers, missing files in
    # the wheel/sdist) here, before they bite us at PyPI release time.
    # Matrix mirrors `lidenbrock-tests` so the wheel smoke-install is
    # exercised under every supported Python — a 3.13-only metadata
    # incompatibility (eg. a hatchling plugin) would otherwise sail
    # past CI and break consumers downstream.
    runs-on: ubuntu-latest
    # Wave-5 review — no job may idle toward the 6 h default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/lidenbrock
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build tooling
        # twine>=7 pinned deliberately: it is the first release that accepts
        # the Metadata-Version 2.4 `License-File` field hatchling emits.
        run: pip install build "twine>=7"
      - name: Build wheel + sdist
        run: python -m build
      - name: Check distribution metadata
        # Was skipped, on a reason that has since expired: twine < 7
        # rejected the Metadata-Version 2.4 `License-File` field hatchling
        # emits, so the check was a false negative on wheel quality. twine 7
        # accepts it (verified against this exact wheel), so the gate is back
        # — a metadata regression should fail here, not at upload time.
        run: python -m twine check dist/*
      - name: Verify wheel is installable + importable
        # Smoke-install the wheel into a fresh venv and exercise the
        # public API. Catches missing files in the wheel, broken
        # dependencies, or import-time errors.
        #
        # _smoke_imports.py is the single source of truth shared with
        # the publish workflow and scripts/release-lidenbrock.sh — it
        # iterates `lidenbrock.__all__` so any drift trips here. See
        # roadmap L5 / B6.
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install dist/*.whl
          /tmp/wheel-smoke/bin/python _smoke_imports.py
      - name: Checksum the distributions
        # The publish workflow downloads THIS artifact and publishes it
        # without rebuilding (tested bytes = published bytes); the sums
        # file lets it prove the download is intact before uploading.
        if: matrix.python-version == '3.11'
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Upload distribution artifacts
        # Only one matrix leg uploads to avoid name collisions on
        # actions/upload-artifact@v4 (which errors on duplicate names).
        # The 3.11 build is the canonical release artifact — the other
        # legs only need to prove the wheel builds and imports cleanly.
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: lidenbrock-dist
          path: packages/lidenbrock/dist/
          if-no-files-found: error

